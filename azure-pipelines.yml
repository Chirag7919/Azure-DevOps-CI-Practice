trigger: none

pool:
  name: default

stages:
- stage: terraform_init
  jobs:
  - job: init
    steps:
    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'init'
        backendServiceArm: 'Pay-As-You-Go (36acc020-70d9-4256-b01b-f8395250115f)'
        backendAzureRmStorageAccountName: 'niteshstg25'
        backendAzureRmContainerName: 'nitu'
        backendAzureRmKey: 'terraform.tfstate'

    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'plan'
        environmentServiceNameAzureRM: 'Pay-As-You-Go (36acc020-70d9-4256-b01b-f8395250115f)'

- stage: terraform_apply
  jobs:
  - job: init
    steps:
    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'init'
        backendServiceArm: 'Pay-As-You-Go (36acc020-70d9-4256-b01b-f8395250115f)'
        backendAzureRmStorageAccountName: 'niteshstg25'
        backendAzureRmContainerName: 'nitu'
        backendAzureRmKey: 'terraform.tfstate'

    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'apply'
        environmentServiceNameAzureRM: 'Pay-As-You-Go (36acc020-70d9-4256-b01b-f8395250115f)'
        
- stage: terraform_destroy
  jobs:
  - job: destroy
    steps:
    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'init'
        backendServiceArm: 'Pay-As-You-Go (36acc020-70d9-4256-b01b-f8395250115f)'
        backendAzureRmStorageAccountName: 'niteshstg25'
        backendAzureRmContainerName: 'nitu'
        backendAzureRmKey: 'terraform.tfstate'    
    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'destroy'
        environmentServiceNameAzureRM: 'Pay-As-You-Go (36acc020-70d9-4256-b01b-f8395250115f)'
                